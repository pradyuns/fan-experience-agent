services:
  postgres:
    image: postgres:16
    container_name: fan-experience-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fan_experience}
      POSTGRES_USER: ${POSTGRES_USER:-fan_experience}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fan_experience}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fan_experience} -d ${POSTGRES_DB:-fan_experience}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: fan-experience-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: fan-experience-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4318:4318"
      - "9464:9464"
    volumes:
      - ./ops/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  postgres_data:
  redis_data:
